rules:
  - id: "windows_active"
    description: "Check if windows is activated"
    parameter: "active"
    operator: "eq"
    value: "yes"
    score: 25

  - id: "windows_updated"
    description: "Check if windows was updated within the last week"
    parameter: "update_status"
    operator: "eq"
    value: "current"
    score: 25

  - id: "windows_activation_genuine"
    description: "Check if the windows activation is genuine"
    parameter: "genuine"
    operator: "eq"
    value: "yes"
    score: 25  

  - id: "packet_loss"
    description: "Check if packet loss is strictly greater than 4%"
    parameter: "loss"
    expected_format: "numeric_extract"
    operator: "gt"
    value: 4
    score: 25
