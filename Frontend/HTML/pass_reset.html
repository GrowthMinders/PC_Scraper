<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../ASSETS/favicon.ico">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Sweet Alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="../STYLES/main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>PC Scraper</title>
</head>
<body class="bg-light">

   <div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-5">
    
     <div id="brand_panel" class="mb-4 text-center">
       <img src="../ASSETS/Logo.png" alt="PC Scraper Logo" class="img-fluid main-logo">
     </div>

     <div id="login_panel" class="p-4 shadow-sm text-center">
        <form class="d-flex flex-column align-items-center w-100 gap-3">
            
            <input type="password" id="pass" class="form-control pass" placeholder="Enter a new password">
            
            <input type="password" id="cpass" class="form-control" placeholder="Confirm Password">
            
            <button type="button" id="reset_btn" class="btn w-100 fw-bold mt-2">Reset Password</button>
            
            <div class="mt-3 text-center">
                <img src="../ASSETS/Sri_Dedunu_Tech_Solutions.png" id="company-logo" class="img-fluid" alt="Sri Dedunu Tech Solutions">
            </div>
            
        </form>
     </div>

   </div>
     
    <!-- password reset Logic Script -->
    <script src="../API/authentication/pass_reset.js"></script>
</body>
</html>
