<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../ASSETS/favicon.ico">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Sweet Alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="../STYLES/main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>PC Scraper</title>
</head>
<body class="bg-light">

   <div class="container min-vh-100 d-flex flex-column align-items-center justify-content-center py-5">
    
    
     <div id="reg_brand_panel" class="mb-4 text-center">
       <img src="../ASSETS/Logo.png" alt="PC Scraper Logo" class="img-fluid main-logo">
     </div>

    
     <div id="register_panel" class="p-4 p-md-5 shadow-sm">
        <form class="w-100">
            
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <input type="text" id="fname" class="form-control" placeholder="First Name">
                </div>
                <div class="col-12 col-md-6">
                    <input type="text" id="lname" class="form-control" placeholder="Last Name">
                </div>
                <div class="col-12 col-md-6">
                    <input type="text" id="uname" class="form-control" placeholder="Username">
                </div>
                <div class="col-12 col-md-6">
                    <input type="email" id="email" class="form-control" placeholder="Email">
                </div>
                <div class="col-12">
                    <input type="tel" id="tel" class="form-control" placeholder="Contact Number">
                </div>
                <div class="col-12 col-md-6">
                    <input type="password" id="pass" class="form-control" placeholder="Password">
                </div>
                <div class="col-12 col-md-6">
                    <input type="password" id="cpass" class="form-control" placeholder="Confirm Password">
                </div>
                
                
                <div class="col-12 mt-4 text-center">
                    <button type="button" id="reg_btn" class="btn fw-bold">Register</button> 
                </div>
            </div>

            
            <div class="mt-4 text-center">
                <img src="../ASSETS/Sri_Dedunu_Tech_Solutions.png" id="company-logo" class="img-fluid" alt="Sri Dedunu Tech Solutions">
            </div>
        </form>
     </div>

   </div>
   <!-- Registration Logic Script -->
   <script src="../API/authentication/register.js"></script>
</body>
</html>
